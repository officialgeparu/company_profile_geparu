<!DOCTYPE html>
<html lang="id">
<head>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Company Profile GEPARU</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #0b1d3a;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    .container {
        max-width: 900px;
        margin: auto;
        padding: 15px;
    }

    .profile {
        width: 100%;
        display: block;
        border-radius: 12px;
        box-shadow: 0 5px 25px rgba(0,0,0,0.4);
    }

    .music-button {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 9999;

        border: none;
        border-radius: 50px;
        padding: 14px 22px;

        background: #102a43;
        color: white;

        font-size: 15px;
        font-weight: bold;

        cursor: pointer;

        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .music-button:hover {
        transform: scale(1.05);
    }
</style>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<link rel="shortcut icon" href="/favicon.svg?v=1">
</head>

<body>

<div class="container">

    <img
        src="company-profile.jpeg"
        alt="Company Profile GEPARU"
        class="profile"
    >

</div>

<audio id="geparuMusic" loop preload="auto">
    <source src="jingle-geparu.mp3" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("geparuMusic");

let musicStarted = false;

function startMusic() {
    if (!musicStarted) {
        music.play().then(() => {
            musicStarted = true;
        }).catch(() => {});
    }
}

// Mulai musik saat warga pertama kali berinteraksi
document.addEventListener("click", startMusic, { once: true });
document.addEventListener("touchstart", startMusic, { once: true });
document.addEventListener("keydown", startMusic, { once: true });
</script>


<!-- GEPARU PLATFORM ANALYTICS -->
<script>
(function(){
  "use strict";
  const ANALYTICS_ENDPOINT="https://fysaxpqpqexjnlpkbwap.supabase.co/functions/v1/geparu-analytics";
  const VISITOR_KEY="geparu_analytics_visitor_id";
  const SESSION_KEY="geparu_analytics_session_id";
  function makeId(){return window.crypto&&crypto.randomUUID?crypto.randomUUID():"geparu-"+Date.now()+"-"+Math.random().toString(16).slice(2);}
  function getOrCreate(storage,key){try{let v=storage.getItem(key);if(!v){v=makeId();storage.setItem(key,v);}return v;}catch(e){return makeId();}}
  const visitorId=getOrCreate(localStorage,VISITOR_KEY);
  const sessionId=getOrCreate(sessionStorage,SESSION_KEY);
  function detectDevice(){const ua=navigator.userAgent||"";if(/tablet|ipad/i.test(ua))return"tablet";if(/mobi|android/i.test(ua))return"mobile";return"desktop";}
  function detectOS(){const ua=navigator.userAgent||"";if(/windows/i.test(ua))return"Windows";if(/android/i.test(ua))return"Android";if(/iphone|ipad|ipod/i.test(ua))return"iOS";if(/mac os/i.test(ua))return"macOS";if(/linux/i.test(ua))return"Linux";return"Unknown";}
  function detectBrowser(){const ua=navigator.userAgent||"";if(/edg/i.test(ua))return"Edge";if(/opr|opera/i.test(ua))return"Opera";if(/firefox/i.test(ua))return"Firefox";if(/chrome|crios/i.test(ua))return"Chrome";if(/safari/i.test(ua))return"Safari";return"Unknown";}
  function send(payload){return fetch(ANALYTICS_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),keepalive:true}).then(async r=>{if(!r.ok)console.warn("GEPARU Analytics gagal:",r.status,await r.text());return r;}).catch(e=>console.warn("GEPARU Analytics error:",e));}
  function trackPageview(){return send({action:"pageview",visitor_id:visitorId,session_id:sessionId,page_path:location.pathname+location.search,page_title:document.title,page_url:location.href,referrer:document.referrer||"",timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||"",language:navigator.language||"",screen_width:window.screen?window.screen.width:null,screen_height:window.screen?window.screen.height:null,device_type:detectDevice(),operating_system:detectOS(),browser:detectBrowser()});}
  window.GEPARU_ANALYTICS={trackEvent:(eventName,category,label,metadata)=>send({action:"event",visitor_id:visitorId,session_id:sessionId,event_name:eventName,event_category:category||"",event_label:label||"",page_path:location.pathname+location.search,metadata:metadata||{}}),trackPageview};
  trackPageview();
})();
</script>

</body>
</html>
