<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Company Profile GEPARU</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #0b1d3a;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    .container {
        max-width: 900px;
        margin: auto;
        padding: 15px;
    }

    .profile {
        width: 100%;
        display: block;
        border-radius: 12px;
        box-shadow: 0 5px 25px rgba(0,0,0,0.4);
    }

    .music-button {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 9999;

        border: none;
        border-radius: 50px;
        padding: 14px 22px;

        background: #102a43;
        color: white;

        font-size: 15px;
        font-weight: bold;

        cursor: pointer;

        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .music-button:hover {
        transform: scale(1.05);
    }
</style>
</head>

<body>

<div class="container">

    <img
        src="alsbobers.jpeg"
        alt="Company Profile GEPARU"
        class="profile"
    >

</div>

<audio id="geparuMusic" loop preload="auto">
    <source src="jingle-geparu.mp3" type="audio/mpeg">
</audio>

<button id="musicButton" class="music-button">
    🎵 Putar Jingle
</button>

<script>

const music = document.getElementById("geparuMusic");
const button = document.getElementById("musicButton");

button.addEventListener("click", function () {

    if (music.paused) {

        music.play();

        button.innerHTML = "🔊 Jingle ON";

    } else {

        music.pause();

        button.innerHTML = "🎵 Putar Jingle";

    }

});

</script>

</body>
</html>
